map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name localhost;
  proxy_http_version 1.1;

  # re-resolve container names, so a restarted backend doesn't leave a stale address (502)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:4000;
  set $frontend http://host.docker.internal:3000;

  # API, websocket and auth routes go to the backend; everything else to the frontend
  location ~ ^/(api(?!-docs$)|socket|sitemap.xml|auth/auth0|auth/auth0/callback|auth/logout) {
    proxy_pass         $backend;
    proxy_set_header   Host "$host";
    proxy_set_header   X-Real-IP "$remote_addr";
    proxy_set_header   X-Forwarded-For "$proxy_add_x_forwarded_for";
    proxy_set_header   X-Forwarded-Proto "$scheme";
    proxy_set_header   Upgrade "$http_upgrade";
    proxy_set_header   Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
  }

  # RoxChain RPC for the browser: the RPC node rejects browser calls from other origins (403 CORS Rejected),
  # so the page calls /rpc here and nginx forwards it server-side, without the Origin header
  location = /rpc {
    proxy_pass         https://ro-dev.roxchain.io/;
    proxy_ssl_server_name on;
    proxy_set_header   Host ro-dev.roxchain.io;
    proxy_set_header   Origin "";
  }

  # RoxChain logos, icons and other branding files
  location /branding/ {
    alias /usr/share/nginx/branding/;
    add_header Access-Control-Allow-Origin *;
  }

  # frontend dev server running on the Mac (./run-frontend-dev.sh)
  location / {
    proxy_pass         $frontend;
    proxy_set_header   Host "$host";
    proxy_set_header   X-Real-IP "$remote_addr";
    proxy_set_header   X-Forwarded-For "$proxy_add_x_forwarded_for";
    proxy_set_header   X-Forwarded-Proto "$scheme";
    proxy_set_header   Upgrade "$http_upgrade";
    proxy_set_header   Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
  }
}
