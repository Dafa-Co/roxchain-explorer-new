# Local RoxChain explorer against the dev RPC (https://ro-dev.roxchain.io).
# Open http://localhost:8088 after `docker compose up -d` (from this folder).
#
#   db        Postgres for the indexer and API
#   backend   Blockscout backend (./backend), run from source with mix: uses the code already
#             compiled in the `rox-explorer-build` volume and the `rox-explorer-deps` image
#             (built from backend/docker/Dockerfile, target builder-deps)
#   frontend  frontend image (built from ./frontend/Dockerfile); optional, `--profile docker-frontend`.
#             For design work run the frontend on the Mac instead: ./run-frontend-dev.sh (hot reload)
#   proxy     nginx on :8088 -> /api and /socket to backend, /branding to ./branding,
#             everything else to the frontend dev server on the Mac (port 3000)

services:
  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in local/.env (see .env.example)}
    command: postgres -c max_connections=200
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: rox-explorer-deps:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./envs/backend.env
    # same compile-time settings the code was compiled with, so nothing is recompiled
    environment:
      MIX_ENV: prod
      DISABLE_WEBAPP: "true"
      ADMIN_PANEL_ENABLED: "false"
      # secrets come from local/.env, which is not committed (see .env.example)
      DATABASE_URL: postgresql://blockscout:${POSTGRES_PASSWORD}@db:5432/blockscout
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in local/.env (see .env.example)}
    volumes:
      - ../backend/apps:/app/apps
      - ../backend/config:/app/config
      - ../backend/mix.exs:/app/mix.exs
      - ../backend/mix.lock:/app/mix.lock
      - rox-explorer-build:/app/_build
    command: >
      sh -c "mix run --no-start -e 'Explorer.ReleaseTasks.create_and_migrate()' && exec mix phx.server"

  frontend:
    image: roxchain-explorer-frontend:local
    profiles: [docker-frontend]
    restart: unless-stopped
    depends_on: [backend]
    env_file: ./envs/frontend.env

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:8088:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./branding:/usr/share/nginx/branding:ro

volumes:
  db-data: {}
  rox-explorer-build:
    external: true
