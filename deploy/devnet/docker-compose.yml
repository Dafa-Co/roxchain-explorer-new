# RoxChain explorer, devnet deployment (https://devnet.explorer.roxchain.io) on the sandbox host.
# Deployed by .github/workflows/devnet-workflow.yaml; run from this folder:
#   docker compose up -d
#
#   db        Postgres for the indexer and API
#   backend   roxchain-explorer-backend:latest  (built by the workflow from backend/docker/Dockerfile)
#   frontend  roxchain-explorer-frontend:latest (built by the workflow from frontend/Dockerfile)
#
# The host's nginx (not in this repo) serves the domain:
#   /api, /socket, /sitemap.xml -> 127.0.0.1:14000 (backend)
#   /rpc                        -> https://ro-dev.roxchain.io (rate limited)
#   /branding/                  -> local/branding/ in this repo
#   everything else             -> 127.0.0.1:13000 (frontend)
#
# Secrets come from deploy/devnet/.env on the host (not committed, see .env.example).
# For running the explorer on your own machine, use local/ instead.

name: roxchain-explorer-devnet

services:
  db:
    image: postgres:17
    restart: unless-stopped
    shm_size: 256m
    environment:
      POSTGRES_DB: blockscout
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/devnet/.env (see .env.example)}
    command: postgres -c max_connections=200
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout -d blockscout"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: roxchain-explorer-backend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:14000:4000"
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend.env
    environment:
      DISABLE_WEBAPP: "true"
      ADMIN_PANEL_ENABLED: "false"
      DATABASE_URL: postgresql://blockscout:${POSTGRES_PASSWORD}@db:5432/blockscout
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in deploy/devnet/.env (see .env.example)}
    command: sh -c 'bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start'

  frontend:
    image: roxchain-explorer-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    depends_on: [backend]
    env_file: ./frontend.env

volumes:
  # The database volume created when devnet still ran from local/ (compose project "local").
  # External on purpose: if it is missing, compose fails instead of starting an empty database
  # (which would mean indexing the whole chain again).
  db-data:
    name: local_db-data
    external: true
